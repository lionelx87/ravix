[package]
name = "ravix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An animated git client for the terminal"
authors = ["Lionel Acosta"]
license = "MIT"
repository = "https://github.com/lionelx87/ravix"
readme = "README.md"
keywords = ["git", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rx"
path = "src/main.rs"

[lib]
name = "ravix"
path = "src/lib.rs"

[dependencies]
crossterm = "0.29.0"
git2 = "0.21.0"
notify = "8.2.0"
ratatui = "0.30.2"
similar = "3.1.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
